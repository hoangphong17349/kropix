<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Kropix — Chỉnh sửa ảnh online miễn phí</title>
<meta name="description" content="Cắt, đổi cỡ, xoay, xóa nền, chỉnh màu, vẽ và thêm chữ — một khung ảnh duy nhất.">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.css">
<style>
:root{
  --bg:#16171a; --panel:#1e2024; --panel-2:#26282f; --line:#2c2e33;
  --text:#e7e6e2; --dim:#8b8d92; --accent:#e8a33d; --ink:#201603;
  --erase:#ef6a5a; --restore:#4fa3f7;
  --topbar-h:52px; --toolbar-h:68px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:#0d0e10; color:var(--text);
  font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  height:100dvh; overflow:hidden;
  display:flex; justify-content:center;
}
.app{
  width:100%; max-width:1200px; height:100dvh;
  display:flex; flex-direction:column;
  background:var(--bg); overflow:hidden;
  border-left:1px solid var(--line); border-right:1px solid var(--line);
}
button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
input,select,textarea{font:inherit}
.hidden{display:none!important}

.topbar{
  flex:0 0 auto; height:var(--topbar-h);
  display:flex; align-items:center; gap:8px;
  padding:0 12px; background:var(--panel);
  border-bottom:1px solid var(--line); z-index:20;
}
.topbar .brand{font-size:17px;font-weight:700;letter-spacing:-.01em}
.topbar .meta{flex:1;min-width:0;font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .actions{display:flex;gap:6px}
.tb-btn{height:36px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel-2);color:var(--text);font-size:13px;display:flex;align-items:center;gap:6px}
.tb-btn:disabled{opacity:.35;cursor:not-allowed}
.tb-btn.primary{background:var(--accent);border-color:var(--accent);color:var(--ink);font-weight:600}
@media(max-width:420px){.tb-btn .lbl{display:none}.tb-btn{padding:0 10px}}
@media(max-width:360px){.topbar .brand{display:none}}

.viewport{
  flex:1 1 auto; min-height:0; display:flex; align-items:center; justify-content:center;
  padding:12px; position:relative; overflow:hidden; background-color:#1a1c21;
  background-image:linear-gradient(45deg,#202226 25%,transparent 25%),linear-gradient(-45deg,#202226 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#202226 75%),linear-gradient(-45deg,transparent 75%,#202226 75%);
  background-size:20px 20px; background-position:0 0,0 10px,10px -10px,-10px 0;
}
.canvas-wrap{position:relative;display:inline-block;max-width:100%;max-height:100%;line-height:0}
.canvas-wrap > canvas,.canvas-wrap > img{display:block;max-width:100%;max-height:100%;width:auto;height:auto;border-radius:4px}
.canvas-wrap > .layer{position:absolute;inset:0;width:100%!important;height:100%!important;max-width:none!important;max-height:none!important;border-radius:0}
#view{touch-action:none;cursor:default}

.drop{position:absolute;inset:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;border:1px dashed var(--line);border-radius:12px;color:var(--dim);cursor:pointer;transition:.15s}
.drop:hover{border-color:var(--accent);color:var(--text)}
.drop .big{font-size:15px;color:var(--text)}
.drop .small{font-size:13px}

.sheet{flex:0 0 auto;display:flex;flex-direction:column;max-height:0;overflow:hidden;background:var(--panel);border-top:1px solid var(--line);transition:max-height .25s ease;z-index:15}
.sheet.open{max-height:min(32dvh,300px)}
.sheet-head{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line)}
.sheet-head h2{font-size:15px;font-weight:600}
.sheet-body{flex:1 1 auto;min-height:0;overflow-y:auto;padding:14px;-webkit-overflow-scrolling:touch}

.toolbar{flex:0 0 auto;height:var(--toolbar-h);display:flex;background:var(--panel);border-top:1px solid var(--line);padding:0 4px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;z-index:18}
.toolbar::-webkit-scrollbar{display:none}
.tool-btn{flex:1 0 64px;min-width:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;background:none;border:none;color:var(--dim);padding:6px 4px;border-radius:8px;font-size:11px;line-height:1.1;transition:color .15s,background .15s}
.tool-btn .ic{font-size:20px;line-height:1}
.tool-btn.active{color:var(--accent);background:rgba(232,163,61,.12)}
.tool-btn:disabled{opacity:.4;cursor:not-allowed}
@media(min-width:640px){.tool-btn{min-width:0;flex:1}.tool-btn .ic{font-size:22px}}

/* Màn hình rộng: dành một cột riêng cho công cụ, không đè lên vùng ảnh. */
@media(min-width:760px){
  .app{display:grid;grid-template-columns:minmax(0,1fr) 0;grid-template-rows:var(--topbar-h) minmax(0,1fr) var(--toolbar-h);transition:grid-template-columns .22s ease}
  .app.tools-open{grid-template-columns:minmax(0,1fr) 320px}
  .topbar{grid-row:1;grid-column:1/-1}
  .viewport{grid-row:2;grid-column:1}
  .sheet{grid-row:2;grid-column:2;min-width:0;max-height:none;border-top:0;border-left:1px solid var(--line);transition:none}
  .sheet.open{max-height:none}
  .toolbar{grid-row:3;grid-column:1/-1}
}

.field{margin-bottom:14px}.field:last-child{margin-bottom:0}
.lbl{display:block;font-size:12.5px;color:var(--dim);margin-bottom:6px}
.lblrow{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-size:12.5px;color:var(--dim)}
.val{color:var(--accent);font-variant-numeric:tabular-nums;font-weight:600}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:22px;background:transparent;outline:none;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:4px;background:var(--line);border-radius:2px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--accent);margin-top:-8px;border:2px solid var(--bg)}
input[type=range]::-moz-range-track{height:4px;background:var(--line);border-radius:2px}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--accent);border:2px solid var(--bg)}
input[type=number],input[type=text],select,textarea{width:100%;min-height:38px;background:var(--panel-2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:16px}
textarea{resize:vertical;min-height:56px;font-size:14px}
input[type=color]{width:48px;height:38px;padding:3px;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;cursor:pointer}
.btn{font-size:13.5px;padding:10px 14px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--text);display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:38px}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--ink);font-weight:600}
.btn.ghost{color:var(--dim)}
.btn.on{background:var(--accent);border-color:var(--accent);color:var(--ink);font-weight:600}
.btn.reset-control{color:var(--dim);background:rgba(255,255,255,.025);border-color:var(--line);transition:background .15s,border-color .15s,color .15s,opacity .15s}
.btn.reset-control:not(:disabled):not(.reset-ready){color:var(--text)}
.btn.reset-ready{background:var(--accent);border-color:var(--accent);color:var(--ink);font-weight:600}
.btn.full{width:100%}
.reset1{background:none;border:none;padding:0;color:var(--dim);font-size:12px;cursor:pointer;text-decoration:underline;margin-left:8px;min-height:0}
.reset1:disabled{opacity:.35;cursor:default;text-decoration:none}
.lblrow .reset1{flex:none}
.btn.sm{padding:8px 12px;font-size:12.5px;min-height:34px}
.btns{display:flex;gap:8px;flex-wrap:wrap}.btns .btn{flex:1;min-width:0}
.two{display:flex;gap:10px}.two > *{flex:1;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.presets{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.hint{font-size:12px;color:var(--dim);line-height:1.5;margin-top:10px}
.check{display:flex;align-items:center;gap:8px;font-size:13px;margin-bottom:12px;cursor:pointer}
.check input{width:auto;min-height:auto}

.brush-cursor{position:absolute;z-index:12;width:0;height:0;border:2px solid var(--accent);border-radius:50%;pointer-events:none;display:none;transform:translate(-50%,-50%);box-shadow:0 0 0 1px rgba(0,0,0,.55),0 0 12px rgba(232,163,61,.35);background:rgba(232,163,61,.08);will-change:left,top,width,height}
#brush-cursor{border-color:var(--erase);background:rgba(239,106,90,.12)}
#brush-cursor.restore{border-color:var(--restore);background:rgba(79,163,247,.12)}
#draw-ring{border-color:var(--accent);background:rgba(232,163,61,.10)}
#draw-ring.eraser{border-color:var(--text);background:rgba(255,255,255,.15)}

.dt{position:absolute;pointer-events:auto;cursor:move;white-space:pre;user-select:none;padding:2px 4px;border:1px dashed transparent;font-weight:bold;touch-action:none}
.dt.sel{border-color:var(--accent)}
#text-layer{display:none;pointer-events:none}
#text-layer.on{display:block;pointer-events:auto}

.export-modal{position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;padding:16px}
.export-dialog{width:min(100%,420px);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}
.export-dialog h2{font-size:18px;margin-bottom:16px}
.export-size{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line);font-size:13px}
.export-size span{color:var(--dim)}
.export-size strong{font-size:15px;color:var(--accent)}

#dropzone-hint{position:fixed;inset:0;z-index:200;pointer-events:none;background:rgba(22,23,27,.85);border:3px dashed var(--accent);display:none;align-items:center;justify-content:center;font-size:20px;font-weight:600;color:var(--accent)}
#dropzone-hint.show{display:flex}

.cropper-view-box,.cropper-face{background:rgba(232,163,61,.08)}
.cropper-line,.cropper-point{background-color:var(--accent)}
#crop-img{max-width:100%;max-height:100%}
.canvas-wrap.cropping{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;max-width:none;max-height:none;line-height:0}
#crop-holder{position:relative;margin:0 auto;line-height:0}
#crop-holder.hidden{display:none!important}
#crop-holder > img{display:block;max-width:100%;max-height:100%;margin:0 auto}
#brush-preview{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);border-radius:50%;border:2px solid var(--erase);background:rgba(239,106,90,.14);pointer-events:none;opacity:0;z-index:30;transition:opacity .2s,width .05s,height .05s}
#brush-preview.show{opacity:1}
#brush-preview.restore{border-color:var(--restore);background:rgba(79,163,247,.14)}
#brush-preview .t{position:absolute;top:calc(100% + 8px);left:50%;transform:translateX(-50%);font-size:12px;background:rgba(0,0,0,.65);padding:2px 8px;border-radius:6px;white-space:nowrap;color:#fff}
</style>
</head>
<body>
<input type="file" id="gfile" accept="image/*" style="display:none">
<div id="dropzone-hint">Thả ảnh vào đây để mở</div>

<div class="app">
  <header class="topbar">
    <div class="brand">Kropix</div>
    <div class="meta" id="topbar-meta">Chưa có ảnh</div>
    <div class="actions">
      <button class="tb-btn primary" id="btn-open"><span>📁</span><span class="lbl">Mở ảnh</span></button>
      <button class="tb-btn" id="btn-undo" disabled><span>↶</span><span class="lbl">Hoàn tác</span></button>
      <button class="tb-btn" id="btn-dl" disabled><span>⬇</span><span class="lbl">Tải ảnh</span></button>
    </div>
  </header>

  <div class="viewport" id="viewport">
    <div class="canvas-wrap hidden" id="canvas-wrap">
      <canvas id="view"></canvas>
      <div id="crop-holder" class="hidden"><img id="crop-img" alt=""></div>
      <div id="text-layer" class="layer"></div>
      <div id="brush-cursor" class="brush-cursor"></div>
      <div id="draw-ring" class="brush-cursor"></div>
    </div>
    <div id="brush-preview"><span class="t" id="brush-preview-label">35px</span></div>
    <div class="drop" id="drop">
      <div class="big">📸 Kéo thả ảnh vào đây</div>
      <div class="small">hoặc bấm để chọn file</div>
    </div>
  </div>

  <div class="sheet" id="sheet">
    <div class="sheet-head">
      <h2 id="sheet-title">Công cụ</h2>
      <button class="btn primary sm" id="sheet-done">✓ Xong</button>
    </div>
    <div class="sheet-body" id="sheet-body"></div>
  </div>

  <nav class="toolbar" id="toolbar">
    <button class="tool-btn" data-tool="crop"><span class="ic">✂️</span><span>Cắt</span></button>
    <button class="tool-btn" data-tool="resize"><span class="ic">📐</span><span>Kích thước</span></button>
    <button class="tool-btn" data-tool="flip"><span class="ic">⇋</span><span>Xoay</span></button>
    <button class="tool-btn" data-tool="brush"><span class="ic">🖌️</span><span>Xóa nền</span></button>
    <button class="tool-btn" data-tool="adjust"><span class="ic">🌗</span><span>Màu</span></button>
    <button class="tool-btn" data-tool="draw"><span class="ic">🖊️</span><span>Vẽ</span></button>
    <button class="tool-btn" data-tool="text"><span class="ic">🔤</span><span>Chữ</span></button>
  </nav>
</div>

<div class="export-modal hidden" id="export-modal">
  <div class="export-dialog">
    <h2>Tải ảnh</h2>
    <div class="field">
      <label class="lbl">Định dạng</label>
      <select id="export-format">
        <option value="webp">WebP — nhỏ gọn</option>
        <option value="png">PNG — chất lượng cao</option>
      </select>
    </div>
    <div class="field" id="export-q-wrap">
      <div class="lblrow"><span>Chất lượng</span><span class="val" id="export-q-v">85%</span></div>
      <input type="range" id="export-q" min="70" max="95" value="85">
    </div>
    <div class="export-size"><span>Dung lượng ước tính</span><strong id="export-size">—</strong></div>
    <div class="btns" style="margin-top:14px">
      <button class="btn" id="export-cancel">Hủy</button>
      <button class="btn primary" id="export-go">⬇ Tải xuống</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.js"></script>
<script>
/* ======================================================================
   TIỆN ÍCH
   ====================================================================== */
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const newCanvas = (w, h) => { const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(w)); c.height = Math.max(1, Math.round(h)); return c; };
const copyCanvas = src => { const c = newCanvas(src.width, src.height); c.getContext('2d').drawImage(src, 0, 0); return c; };
const scaledCopy = (src, max) => {
  const s = Math.min(1, max / Math.max(src.width, src.height));
  const c = newCanvas(src.width * s, src.height * s);
  const x = c.getContext('2d');
  x.imageSmoothingQuality = 'high';
  x.drawImage(src, 0, 0, c.width, c.height);
  return c;
};
const fmtBytes = b => b < 1024 ? b + ' B' : b < 1048576 ? (b / 1024).toFixed(1) + ' KB' : (b / 1048576).toFixed(2) + ' MB';
const isImg = f => !!(f && f.type && f.type.startsWith('image/'));
const readDataURL = (f, cb) => { const r = new FileReader(); r.onload = e => cb(e.target.result); r.readAsDataURL(f); };
const loadImg = (src, cb) => { const i = new Image(); i.onload = () => cb(i); i.src = src; };
const downloadURL = (url, name) => { const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove(); };
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const VIEW_MAX = 2400;   /* giới hạn cạnh dài của canvas hiển thị (giống bản gốc) */

/* ======================================================================
   APP — trạng thái ảnh + điều phối công cụ
   ====================================================================== */
const App = {
  canvas: null, file: null, name: 'anh', hist: [], ver: 0,
  activeTool: null, activeId: null, pendingTool: null,

  /* --- dữ liệu --- */
  setImage(c, file) {
    this._color = null;
    this.canvas = c;
    this.file = file || null;
    this.name = (file ? file.name.replace(/\.[^.]+$/, '') : 'anh') || 'anh';
    this.hist = [];
    this.ver++;
    this.refresh();
  },
  setCanvas(c) {
    this._color = null;
    if (this.canvas) { this.hist.push(this.canvas); if (this.hist.length > 12) this.hist.shift(); }
    this.canvas = c;
    this.file = null;
    this.ver++;
    this.refresh();
  },

  /* --- hiển thị --- */
  baseView() {
    const view = $('#view');
    const s = Math.min(1, VIEW_MAX / Math.max(this.canvas.width, this.canvas.height));
    view.width = Math.round(this.canvas.width * s);
    view.height = Math.round(this.canvas.height * s);
    const x = view.getContext('2d');
    x.clearRect(0, 0, view.width, view.height);
    x.imageSmoothingQuality = 'high';
    x.drawImage(this.canvas, 0, 0, view.width, view.height);
  },
  refresh() {
    updateTopbar();
    const drop = $('#drop'), wrap = $('#canvas-wrap');
    if (!this.canvas) { drop.classList.remove('hidden'); wrap.classList.add('hidden'); return; }
    drop.classList.add('hidden');
    wrap.classList.remove('hidden');
    if (this.activeTool && this.activeTool.render) this.activeTool.render();
    else this.baseView();
  },

  /* --- công cụ --- */
  openTool(id) {
    if (!this.canvas) { this.pendingTool = id; pickFile(); return; }
    if (this.activeId === id) { this.closeTool(); return; }
    if (this.activeTool) this.closeTool();             /* đổi công cụ thì đóng chế độ cũ, không tự áp dụng */
    const tool = TOOLS[id];
    if (!tool) return;
    $('#sheet-title').textContent = tool.title;
    const body = $('#sheet-body');
    body.innerHTML = tool.panel;
    this.activeTool = tool;
    this.activeId = id;
    tool.init(body);
    $$('.tool-btn').forEach(b => b.classList.toggle('active', b.dataset.tool === id));
    $('#sheet').classList.add('open');
    $('.app').classList.add('tools-open');
    tool.enter();
    this.refresh();
  },
  closeTool() {
    const t = this.activeTool;
    this.activeTool = null;
    this.activeId = null;
    if (t && t.leave) t.leave();
    $$('.tool-btn').forEach(b => b.classList.remove('active'));
    $('#sheet').classList.remove('open');
    $('.app').classList.remove('tools-open');
    $('#sheet-body').innerHTML = '';
    this.refresh();
  },
  commitAndClose() {
    const t = this.activeTool;
    if (!t) { this.closeTool(); return; }
    if (t.apply) t.apply(); else this.closeTool();
  },

  /* --- trạng thái --- */
  isDirty() { return !!(this.activeTool && this.activeTool.dirty && this.activeTool.dirty()); },
  undo() {
    const t = this.activeTool;
    if (t && t.handleUndo && t.handleUndo()) return;
    if (this.isDirty() && t && t.discard) { t.discard(); return; }   /* bỏ thay đổi đang xem trước */
    if (!this.hist.length) return;
    const keepId = this.activeId;
    if (t) { this.activeTool = null; this.activeId = null; t.leave(); }
    this.canvas = this.hist.pop();
    this._color = null;
    this.file = null;
    this.ver++;
    updateTopbar();
    this.refresh();
    if (keepId && TOOLS[keepId]) { this.activeId = null; this.openTool(keepId); }
  }
};

function updateTopbar() {
  const meta = $('#topbar-meta');
  if (App.canvas) {
    const src = App.file ? App.file.name : App.name + ' (đã chỉnh sửa)';
    meta.textContent = src + ' · ' + App.canvas.width + '×' + App.canvas.height + ' px';
  } else meta.textContent = 'Chưa có ảnh';
  $('#btn-undo').disabled = !App.hist.length;
  $('#btn-dl').disabled = !App.canvas;
}

/* --- mở file --- */
function pickFile() { const f = $('#gfile'); f.value = ''; f.click(); }
function openFile(file) {
  if (!isImg(file)) return;
  readDataURL(file, url => loadImg(url, img => {
    App.closeTool();
    const c = newCanvas(img.naturalWidth || img.width, img.naturalHeight || img.height);
    c.getContext('2d').drawImage(img, 0, 0);
    App.setImage(c, file);
    if (App.pendingTool) { const p = App.pendingTool; App.pendingTool = null; App.openTool(p); }
  }));
}
$('#gfile').addEventListener('change', e => openFile(e.target.files[0]));
$('#btn-open').onclick = pickFile;
$('#drop').onclick = pickFile;
$('#btn-undo').onclick = () => App.undo();
$$('.tool-btn').forEach(b => b.onclick = () => App.openTool(b.dataset.tool));
$('#sheet-done').onclick = () => App.commitAndClose();

/* --- kéo thả --- */
(function () {
  let n = 0;
  const ov = $('#dropzone-hint');
  const hasFiles = e => e.dataTransfer && Array.from(e.dataTransfer.types).includes('Files');
  window.addEventListener('dragenter', e => { if (!hasFiles(e)) return; e.preventDefault(); n++; ov.classList.add('show'); });
  window.addEventListener('dragover', e => { if (hasFiles(e)) e.preventDefault(); });
  window.addEventListener('dragleave', e => {
    if (!hasFiles(e)) return;
    if (--n <= 0) { n = 0; ov.classList.remove('show'); }
  });
  window.addEventListener('drop', e => {
    if (!hasFiles(e)) return;
    e.preventDefault(); n = 0; ov.classList.remove('show');
    openFile(e.dataTransfer.files[0]);
  });
})();

(function () {
  const modal = $('#export-modal'), fmt = $('#export-format'), q = $('#export-q'), qv = $('#export-q-v');
  const qWrap = $('#export-q-wrap'), size = $('#export-size');
  let timer = 0;
  const isWebp = () => fmt.value === 'webp';

  function estimate() {
    clearTimeout(timer);
    size.textContent = '…';
    timer = setTimeout(() => {
      if (!App.canvas) { size.textContent = '—'; return; }
      const f = fmt.value, quality = parseInt(q.value, 10) / 100;
      App.canvas.toBlob(blob => {
        size.textContent = blob ? fmtBytes(blob.size) : '—';
      }, 'image/' + f, f === 'webp' ? quality : undefined);
    }, 220);
  }

  const savedFmt = localStorage.getItem('kropix_fmt'), savedQ = localStorage.getItem('kropix_q');
  if (savedFmt === 'png' || savedFmt === 'webp') fmt.value = savedFmt;
  if (savedQ) q.value = savedQ;
  qv.textContent = q.value + '%';
  qWrap.classList.toggle('hidden', !isWebp());

  fmt.onchange = () => {
    localStorage.setItem('kropix_fmt', fmt.value);
    qWrap.classList.toggle('hidden', !isWebp());
    estimate();
  };
  q.oninput = () => {
    qv.textContent = q.value + '%';
    localStorage.setItem('kropix_q', q.value);
    if (isWebp()) estimate();
  };

  $('#btn-dl').onclick = () => {
    App.commitAndClose();
    if (!App.canvas) return;
    modal.classList.remove('hidden');
    estimate();
  };
  $('#export-cancel').onclick = () => modal.classList.add('hidden');
  modal.addEventListener('click', e => { if (e.target === modal) modal.classList.add('hidden'); });

})();

/* ======================================================================
   BỘ LỌC MÀU THỦ CÔNG (thay ctx.filter — chạy được trên mọi máy)
   ====================================================================== */
function filterCanvas(src, brightness, contrast, saturation) {
  const w = src.width, h = src.height;
  const c = newCanvas(w, h), ctx = c.getContext('2d');
  ctx.drawImage(src, 0, 0);
  if (!brightness && !contrast && !saturation) return c;
  const data = ctx.getImageData(0, 0, w, h);
  const d = data.data;
  const bf = 1 + brightness / 100;                       /* như brightness(%) */
  const cf = 1 + contrast / 100;                         /* như contrast(%) */
  const sf = 1 + saturation / 100;                       /* như saturate(%) */
  for (let i = 0; i < d.length; i += 4) {
    let r = d[i] * bf, g = d[i + 1] * bf, b = d[i + 2] * bf;
    if (cf !== 1) { r = (r - 128) * cf + 128; g = (g - 128) * cf + 128; b = (b - 128) * cf + 128; }
    if (sf !== 1) {
      const lum = 0.2126 * r + 0.7152 * g + 0.0722 * b;
      r = lum + (r - lum) * sf; g = lum + (g - lum) * sf; b = lum + (b - lum) * sf;
    }
    d[i] = r < 0 ? 0 : r > 255 ? 255 : r;
    d[i + 1] = g < 0 ? 0 : g > 255 ? 255 : g;
    d[i + 2] = b < 0 ? 0 : b > 255 ? 255 : b;
  }
  ctx.putImageData(data, 0, 0);
  return c;
}

(function () {
  let base = null, fh = false, fv = false, rot = 0;
  const norm = () => ((rot % 360) + 360) % 360;

  TOOLS.flip = {
    title: 'Lật & xoay',
    panel: `<div class="grid2">
        <button class="btn" data-act="fh">⇋ Lật trái–phải</button>

        <button class="btn" data-act="rr">↻ Xoay 90° phải</button>

      </div>
      <p class="hint" data-r="state"></p>

        <button class="btn primary" data-act="apply">Áp dụng</button>
      </div>`,
    init(el) {
      const g = fn => () => { if (!base) return; fn(); TOOLS.flip.render(); };
      el.querySelector('[data-act="fh"]').onclick = g(() => fh = !fh);
      el.querySelector('[data-act="fv"]').onclick = g(() => fv = !fv);
      el.querySelector('[data-act="rl"]').onclick = g(() => rot -= 90);
      el.querySelector('[data-act="rr"]').onclick = g(() => rot += 90);
      el.querySelector('[data-act="r180"]').onclick = g(() => rot += 180);
      el.querySelector('[data-act="reset"]').onclick = g(() => { fh = fv = false; rot = 0; });
      el.querySelector('[data-act="apply"]').onclick = () => TOOLS.flip.apply();
    },
    enter() { base = App.canvas; fh = fv = false; rot = 0; this.render(); },
    out() {
      const n = norm(), swap = n === 90 || n === 270;
      return { w: swap ? base.height : base.width, h: swap ? base.width : base.height, n: n };
    },
    render() {
      if (!base) return;
      const o = this.out();
      const view = $('#view');
      const s = Math.min(1, VIEW_MAX / Math.max(o.w, o.h));
      view.width = Math.round(o.w * s);
      view.height = Math.round(o.h * s);
      const x = view.getContext('2d');
      x.clearRect(0, 0, view.width, view.height);
      x.imageSmoothingQuality = 'high';
      x.save();
      x.translate(view.width / 2, view.height / 2);
      x.rotate(o.n * Math.PI / 180);
      x.scale(fh ? -1 : 1, fv ? -1 : 1);
      x.drawImage(base, -base.width * s / 2, -base.height * s / 2, base.width * s, base.height * s);
      x.restore();
      const st = $('#sheet-body').querySelector('[data-r="state"]');
      if (st) st.textContent = 'Lật ngang: ' + (fh ? 'Bật' : 'Tắt') + ' · Lật dọc: ' + (fv ? 'Bật' : 'Tắt') + ' · Góc xoay: ' + o.n + '°';
    },
    dirty() { return !!base && (fh || fv || norm() !== 0); },
    discard() { fh = fv = false; rot = 0; this.render(); },
    leave() { },
    apply() {
      if (!base || !this.dirty()) { App.closeTool(); return; }
      const o = this.out();
      const c = newCanvas(o.w, o.h);
      const x = c.getContext('2d');
      x.imageSmoothingQuality = 'high';
      x.translate(c.width / 2, c.height / 2);
      x.rotate(o.n * Math.PI / 180);
      x.scale(fh ? -1 : 1, fv ? -1 : 1);
      x.drawImage(base, -base.width / 2, -base.height / 2);
      App.closeTool();

    }
  };
})();

/* --------------------------------------------------------- 4. XÓA NỀN CỌ */
(function () {
  let mode = 'erase', size = 35, base = null, view = null, orig = null, mask = null;
  let strokes = [], drawing = false, last = null, els = null;

  /* --- vòng xem trước cỡ cọ (như tool.html) --- */
  function previewSize() {
    if (!view || !view.width) return 0;
    const r = view.getBoundingClientRect();
    return Math.max(4, size * (r.width / view.width));
  }
  function showPreview() {
    const el = $('#brush-preview');
    if (!el) return;
    const d = previewSize();
    el.style.width = el.style.height = d + 'px';
    el.classList.toggle('restore', mode === 'restore');
    el.classList.add('show');
    const lab = $('#brush-preview-label');
    if (lab) lab.textContent = size + 'px';
  }
  function hidePreview() {
    const el = $('#brush-preview');
    if (el) el.classList.remove('show');
  }

  function paintDab(ctx, x, y, r, m) {
    ctx.save();
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    if (m === 'erase') { ctx.fillStyle = '#fff'; ctx.fill(); }
    else { ctx.globalCompositeOperation = 'destination-out'; ctx.fill(); }
    ctx.restore();
  }

  function repaintMask() {
    const mc = mask.getContext('2d');
    mc.clearRect(0, 0, mask.width, mask.height);
    const r = size / 2;
    strokes.forEach(st => st.pts.forEach(p => paintDab(mc, p.x, p.y, st.size / 2, st.mode)));
  }

  function renderView() {
    const x = view.getContext('2d');
    x.clearRect(0, 0, view.width, view.height);
    x.imageSmoothingQuality = 'high';
    x.drawImage(orig, 0, 0);
    x.save();
    x.globalCompositeOperation = 'destination-out';
    x.drawImage(mask, 0, 0);
    x.restore();
  }

  function syncButtons() {
    if (!els) return;
    els.undo.disabled = !strokes.length;
    els.reset.disabled = !strokes.length;
    els.reset.classList.toggle('reset-ready', strokes.length > 0);
  }

  function paintPoint(x, y, m, sz) {
    const r = sz / 2;
    paintDab(mask.getContext('2d'), x, y, r, m);
    const vc = view.getContext('2d');
    if (m === 'erase') {
      vc.save();
      vc.globalCompositeOperation = 'destination-out';
      vc.beginPath(); vc.arc(x, y, r, 0, Math.PI * 2); vc.fill();
      vc.restore();
    } else {
      vc.save();
      vc.beginPath(); vc.arc(x, y, r, 0, Math.PI * 2); vc.clip();
      vc.drawImage(orig, 0, 0);
      vc.restore();
    }
  }

  function addPoint(x, y) {
    const st = strokes[strokes.length - 1];
    if (!st) return;
    if (last) {
      const step = Math.max(1, st.size * 0.25);
      const d = Math.hypot(x - last.x, y - last.y);
      const n = Math.max(1, Math.ceil(d / step));
      for (let i = 1; i <= n; i++) {
        const px = last.x + (x - last.x) * i / n;
        const py = last.y + (y - last.y) * i / n;
        st.pts.push({ x: px, y: py });
        paintPoint(px, py, st.mode, st.size);
      }
    } else {
      st.pts.push({ x: x, y: y });
      paintPoint(x, y, st.mode, st.size);
    }
    last = { x: x, y: y };
    syncButtons();
  }

  function pos(e) {
    const r = view.getBoundingClientRect();
    return { x: (e.clientX - r.left) * view.width / r.width, y: (e.clientY - r.top) * view.height / r.height };
  }

  function showCursor(e) {
    const el = $('#brush-cursor');
    if (!el) return;
    const r = view.getBoundingClientRect();
    const d = size * (r.width / view.width);
    el.style.width = el.style.height = d + 'px';
    el.style.left = (e.clientX - r.left) + 'px';
    el.style.top = (e.clientY - r.top) + 'px';
    el.style.display = 'block';
  }
  function hideCursor() { const el = $('#brush-cursor'); if (el) el.style.display = 'none'; }

  function onDown(e) {
    if (!base) return;
    if (e.isPrimary === false) return;
    e.preventDefault();
    hidePreview();
    view.setPointerCapture(e.pointerId);
    drawing = true;
    last = null;
    strokes.push({ mode: mode, size: size, pts: [] });
    addPoint(pos(e).x, pos(e).y);
    showCursor(e);
  }
  function onMove(e) {
    if (!base) return;
    showCursor(e);
    if (!drawing) return;
    e.preventDefault();
    const p = pos(e);
    addPoint(p.x, p.y);
  }
  function onUp() { drawing = false; last = null; }

  TOOLS.brush = {
    title: 'Xóa nền bằng cọ',
    panel: `<div class="btns">
        <button class="btn on" data-r="mErase">🖌 Xoá</button>
        <button class="btn" data-r="mRestore">↩ Khôi phục</button>
      </div>
      <div class="field" style="margin-top:14px">
        <div class="lblrow"><span>Cỡ cọ</span><span class="val" data-r="sizeV">${size}px</span></div>
        <input type="range" min="5" max="150" value="${size}" data-r="size">
      </div>
      <div class="btns">
        <button class="btn reset-control" data-r="undo" disabled>↶ Hoàn tác nét</button>
        <button class="btn reset-control" data-r="reset" disabled>↺ Đặt lại</button>
      </div>
      <p class="hint">Chạm và kéo trên ảnh để tô. "Xoá" (đỏ) làm vùng tô trong suốt, "Khôi phục" (xanh) vẽ lại phần đã xoá. Kéo thanh cỡ cọ để xem vòng tròn kích thước thật.</p>
      <div class="btns" style="margin-top:12px"><button class="btn primary" data-act="apply">Áp dụng</button></div>`,
    init(el) {
      els = {
        mErase: el.querySelector('[data-r="mErase"]'),
        mRestore: el.querySelector('[data-r="mRestore"]'),
        size: el.querySelector('[data-r="size"]'),
        sizeV: el.querySelector('[data-r="sizeV"]'),
        undo: el.querySelector('[data-r="undo"]'),
        reset: el.querySelector('[data-r="reset"]')
      };
      const setMode = m => {
        mode = m;
        els.mErase.classList.toggle('on', m === 'erase');
        els.mRestore.classList.toggle('on', m === 'restore');
        const cur = $('#brush-cursor');
        if (cur) cur.classList.toggle('restore', m === 'restore');
        const pv = $('#brush-preview');
        if (pv) pv.classList.toggle('restore', m === 'restore');
      };
      els.mErase.onclick = () => setMode('erase');
      els.mRestore.onclick = () => setMode('restore');
      setMode(mode);
      els.size.oninput = () => {
        size = +els.size.value;
        els.sizeV.textContent = size + 'px';
        showPreview();
      };
      ['pointerup', 'mouseup', 'touchend', 'change', 'blur'].forEach(ev => els.size.addEventListener(ev, hidePreview));
      els.size.onchange = () => { size = +els.size.value; els.sizeV.textContent = size + 'px'; };
      els.undo.onclick = () => TOOLS.brush.handleUndo();
      els.reset.onclick = () => {
        strokes = []; last = null;
        repaintMask(); renderView(); syncButtons();
      };
      el.querySelector('[data-act="apply"]').onclick = () => TOOLS.brush.apply();
    },
    enter() {
      base = App.canvas;
      view = $('#view');
      const work = scaledCopy(base, VIEW_MAX);
      view.width = work.width; view.height = work.height;
      const x = view.getContext('2d');
      x.clearRect(0, 0, view.width, view.height);
      x.imageSmoothingQuality = 'high';
      x.drawImage(work, 0, 0);
      orig = copyCanvas(view);
      mask = newCanvas(view.width, view.height);
      strokes = []; last = null; drawing = false;
      view.style.cursor = 'none';
      view.addEventListener('pointerdown', onDown);
      view.addEventListener('pointermove', onMove);
      view.addEventListener('pointerup', onUp);
      view.addEventListener('pointercancel', onUp);
      view.addEventListener('pointerleave', hideCursor);
      syncButtons();
    },
    render() { if (orig) renderView(); },
    dirty() { return strokes.length > 0; },
    discard() { strokes = []; repaintMask(); renderView(); syncButtons(); },
    handleUndo() {

(function () {
  let base = null, layer = null, view = null, lctx = null;
  let strokes = [], redo = [], drawTool = 'pen', color = '#e8a33d', size = 8;
  let drawing = false, lastPt = null, els = null, drawing2 = false;

  function replay() {
    lctx.clearRect(0, 0, layer.width, layer.height);
    strokes.forEach(st => replayStroke(st));
  }
  function replayStroke(st) {
    if (!st.pts.length) return;
    lctx.save();
    lctx.globalCompositeOperation = st.mode === 'eraser' ? 'destination-out' : 'source-over';
    lctx.strokeStyle = st.color;
    lctx.fillStyle = st.color;
    lctx.lineWidth = st.size;
    lctx.lineCap = lctx.lineJoin = 'round';
    if (st.pts.length === 1) {
      lctx.beginPath();
      lctx.arc(st.pts[0].x, st.pts[0].y, st.size / 2, 0, Math.PI * 2);
      lctx.fill();
    } else {
      lctx.beginPath();
      lctx.moveTo(st.pts[0].x, st.pts[0].y);
      for (let i = 1; i < st.pts.length; i++) lctx.lineTo(st.pts[i].x, st.pts[i].y);
      lctx.stroke();
    }
    lctx.restore();
  }
  function renderView() {
    if (!base) return;
    const s = Math.min(1, VIEW_MAX / Math.max(base.width, base.height));
    view.width = Math.round(base.width * s);
    view.height = Math.round(base.height * s);
    const x = view.getContext('2d');
    x.clearRect(0, 0, view.width, view.height);
    x.imageSmoothingQuality = 'high';
    x.drawImage(base, 0, 0, view.width, view.height);
    x.drawImage(layer, 0, 0, view.width, view.height);
  }
  function sync() {
    if (!els) return;
    els.undo.disabled = !strokes.length;
    els.redo.disabled = !redo.length;
    els.clear.disabled = !strokes.length;
    els.clear.classList.toggle('reset-ready', strokes.length > 0);
  }
  function pt(e) {
    const r = view.getBoundingClientRect();
    return { x: (e.clientX - r.left) * layer.width / r.width, y: (e.clientY - r.top) * layer.height / r.height };
  }
  function strokeScale() { return layer.width / view.width; }
  function showRing(e) {
    const el = $('#draw-ring');
    const r = view.getBoundingClientRect();
    const s = size * strokeScale() * (r.width / view.width);
    el.style.width = el.style.height = s + 'px';
    el.style.left = (e.clientX - r.left) + 'px';
    el.style.top = (e.clientY - r.top) + 'px';
    el.style.display = 'block';
  }
  function onDown(e) {
    if (!base || e.isPrimary === false) return;
    e.preventDefault();
    view.setPointerCapture(e.pointerId);
    drawing = true;
    redo = [];
    const p = pt(e);
    lastPt = p;
    strokes.push({ mode: drawTool, color: color, size: size * strokeScale(), pts: [p] });
    const st = strokes[strokes.length - 1];
    replayStroke(st);
    renderView();
    showRing(e);
    sync();
  }
  function onMove(e) {
    if (!base) return;
    showRing(e);
    if (!drawing) return;
    e.preventDefault();
    const p = pt(e);
    const st = strokes[strokes.length - 1];
    const step = Math.max(1, size * strokeScale() * 0.25);
    /* nội suy để nét mượt, không bị đứt khi kéo nhanh */
    const d = Math.hypot(p.x - lastPt.x, p.y - lastPt.y);
    const n = Math.max(1, Math.ceil(d / step));
    for (let i = 1; i <= n; i++) {
      const q = { x: lastPt.x + (p.x - lastPt.x) * i / n, y: lastPt.y + (p.y - lastPt.y) * i / n };
      st.pts.push(q);
    }
    lctx.save();
    lctx.globalCompositeOperation = st.mode === 'eraser' ? 'destination-out' : 'source-over';
    lctx.strokeStyle = st.color;
    lctx.lineWidth = st.size;
    lctx.lineCap = lctx.lineJoin = 'round';
    lctx.beginPath();
    lctx.moveTo(lastPt.x, lastPt.y);
    lctx.lineTo(p.x, p.y);
    lctx.stroke();
    lctx.restore();
    lastPt = p;
    renderView();
  }
  function onUp() { drawing = false; lastPt = null; }

  TOOLS.draw = {
    title: 'Vẽ lên ảnh',
    panel: `<div class="btns" style="margin-bottom:14px">

        <button class="btn reset-control" data-r="undo" disabled>↶ Hoàn tác</button>
        <button class="btn reset-control" data-r="redo" disabled>↷ Làm lại</button>
      </div>
      <div class="btns" style="margin-top:8px">
        <button class="btn reset-control" data-r="clear" disabled>🗑️ Xóa nét vẽ</button>
      </div>
      <p class="hint">Tẩy chỉ xóa nét bút đã vẽ, không làm hỏng ảnh gốc bên dưới.</p>
      <div class="btns" style="margin-top:12px"><button class="btn primary" data-act="apply">Áp dụng</button></div>`,
    init(el) {
      els = {
        pen: el.querySelector('[data-r="pen"]'),
        eraser: el.querySelector('[data-r="eraser"]'),
        color: el.querySelector('[data-r="color"]'),
        size: el.querySelector('[data-r="size"]'),
        sizeV: el.querySelector('[data-r="sizeV"]'),
        undo: el.querySelector('[data-r="undo"]'),
        redo: el.querySelector('[data-r="redo"]'),
        clear: el.querySelector('[data-r="clear"]')
      };
      const setTool = t => {
        drawTool = t;
        els.pen.classList.toggle('on', t === 'pen');
        els.eraser.classList.toggle('on', t === 'eraser');
        $('#draw-ring').classList.toggle('eraser', t === 'eraser');
      };
      els.pen.onclick = () => setTool('pen');
      els.eraser.onclick = () => setTool('eraser');
      setTool(drawTool);
      els.color.oninput = () => { color = els.color.value; };
      els.size.oninput = () => { size = +els.size.value; els.sizeV.textContent = size; };
      els.undo.onclick = () => TOOLS.draw.handleUndo();
      els.redo.onclick = () => TOOLS.draw.handleRedo();
      els.clear.onclick = () => {
        if (!strokes.length) return;
        redo = strokes.slice().reverse().concat(redo);
        strokes = [];
        replay(); renderView(); sync();
      };
      el.querySelector('[data-act="apply"]').onclick = () => TOOLS.draw.apply();
    },
    enter() {
      base = App.canvas;
      view = $('#view');
      layer = newCanvas(base.width, base.height);
      lctx = layer.getContext('2d');
      strokes = []; redo = [];
      renderView();
      view.style.cursor = 'none';
      view.addEventListener('pointerdown', onDown);
      view.addEventListener('pointermove', onMove);
      view.addEventListener('pointerup', onUp);
      view.addEventListener('pointercancel', onUp);
      view.addEventListener('pointerleave', () => { $('#draw-ring').style.display = 'none'; });
      sync();
    },
    render() { renderView(); },
    dirty() { return strokes.length > 0; },
    discard() { strokes = []; redo = []; replay(); renderView(); sync(); },
    handleUndo() {
      if (!strokes.length) return false;
      redo.push(strokes.pop());
      replay(); renderView(); sync();
      return true;
    },
    handleRedo() {
      if (!redo.length) return false;
      strokes.push(redo.pop());
      replay(); renderView(); sync();
      return false;  /* đã xử lý nội bộ */
    },
    leave() {
      view.style.cursor = '';
      view.removeEventListener('pointerdown', onDown);
      view.removeEventListener('pointermove', onMove);
      view.removeEventListener('pointerup', onUp);
      view.removeEventListener('pointercancel', onUp);
      $('#draw-ring').style.display = 'none';
      els = null;
    },
    apply() {
      if (!base || !strokes.length) { App.closeTool(); return; }
      const c = newCanvas(base.width, base.height);
      const x = c.getContext('2d');
      x.imageSmoothingQuality = 'high';
      x.drawImage(base, 0, 0);
      x.drawImage(layer, 0, 0);
      strokes = []; redo = [];
      App.closeTool();
      App.setCanvas(c);
    }
  };
})();

        const it = {
          id: 't' + (idc++), text: 'Chữ của bạn', x: 50, y: 50,
          family: 'Arial, sans-serif', fs: D.fs, color: '#ffffff', weight: 'bold',
          rot: 0, stroke: false, sc: '#000000', sw: D.sw, op: 100
        };
        items.push(it);
        sel = it.id;
        selectUI(); renderOverlay();
      };
      els.del.onclick = () => {
        if (!sel) return;
        items = items.filter(t => t.id !== sel);
        sel = null;
        selectUI(); renderOverlay();
      };
      els.content.oninput = e => set('text', e.target.value);
      els.family.onchange = e => set('family', e.target.value);
      els.color.oninput = e => set('color', e.target.value);
      els.weight.onchange = e => set('weight', e.target.value);
      els.fs.oninput = e => { els.fsV.textContent = e.target.value + 'px'; set('fs', +e.target.value); };
      els.rot.oninput = e => { els.rotV.textContent = e.target.value + '°'; set('rot', +e.target.value); };
      els.stroke.onchange = e => { els.strokeOpt.classList.toggle('hidden', !e.target.checked); set('stroke', e.target.checked); };
      els.strokeColor.oninput = e => set('sc', e.target.value);
      els.sw.oninput = e => { els.swV.textContent = e.target.value + 'px'; set('sw', +e.target.value); };
      els.op.oninput = e => { els.opV.textContent = e.target.value + '%'; set('op', +e.target.value); };
      els.fsR.onclick = () => { els.fs.value = D.fs; els.fsV.textContent = D.fs + 'px'; set('fs', D.fs); };
      els.rotR.onclick = () => { els.rot.value = 0; els.rotV.textContent = '0°'; set('rot', 0); };
      el.querySelector('[data-act="apply"]').onclick = () => TOOLS.text.apply();
    },
    enter() {
      base = App.canvas;
      view = $('#view');
      items = []; sel = null;
      const layer = $('#text-layer');
      layer.classList.add('on');
      layer.innerHTML = '';
      layer.onpointerdown = e => {
        if (e.target === layer) { sel = null; selectUI(); renderOverlay(); }
      };
      renderOverlay();
      selectUI();
    },
    render() {
      if (!base) return;
      const s = Math.min(1, VIEW_MAX / Math.max(base.width, base.height));
      view.width = Math.round(base.width * s);
      view.height = Math.round(base.height * s);
      const x = view.getContext('2d');
      x.clearRect(0, 0, view.width, view.height);
      x.imageSmoothingQuality = 'high';
      x.drawImage(base, 0, 0, view.width, view.height);
      if (items.length) renderOverlay();
    },
    dirty() { return !!(base && items.length); },
    discard() { items = []; sel = null; selectUI(); renderOverlay(); },
    leave() {
      const layer = $('#text-layer');
      layer.classList.remove('on');
      layer.onpointerdown = null;
      layer.innerHTML = '';
      els = null;
    },
    apply() {
      if (!base || !items.length) { App.closeTool(); return; }
      const o = copyCanvas(base);
      const x = o.getContext('2d');
      const s = o.width / view.width;
      items.forEach(it => drawItem(x, it, s));
      items = []; sel = null;
      App.closeTool();
      App.setCanvas(o);
    }
  };
})();

/* --- vẽ lại overlay chữ khi đổi kích thước cửa sổ --- */
/* cho phép kiểm thử / debug từ console */
if (typeof window !== 'undefined') { window.App = App; window.TOOLS = TOOLS; window.filterCanvas = filterCanvas; }

window.addEventListener('resize', () => {
  if (App.activeId === 'text' && App.activeTool && App.activeTool.render) App.activeTool.render();
});
