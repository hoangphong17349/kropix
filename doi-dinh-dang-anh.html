<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chuyển định dạng ảnh online: JPG, PNG, WebP | Kropix</title>
    <meta name="description" content="Chuyển định dạng ảnh online miễn phí giữa JPG, PNG, WebP, BMP và GIF. Chọn ảnh, chọn định dạng đích rồi tải về trong vài giây.">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
  :root {
    --bg: #16171a;
    --panel: #1e2024;
    --panel-2: #26282f;
    --line: #2c2e33;
    --text: #e7e6e2;
    --text-dim: #8b8d92;
    --accent: #e8a33d;
    --accent-ink: #201603;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 40px 24px 80px;
  }

  .container { max-width: 640px; margin: 0 auto; }

  header { margin-bottom: 32px; }

  h1 {
    font-size: 22px;
    font-weight: 600;
    letter-spacing: -0.01em;
    margin-bottom: 6px;
  }

  .subtitle { color: var(--text-dim); font-size: 14px; }

  .main-card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 24px;
  }

  .upload-area {
    border: 1px dashed var(--line);
    border-radius: 10px;
    padding: 40px 20px;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease;
    color: var(--text-dim);
  }

  .upload-area:hover { border-color: var(--accent); color: var(--text); }
  .upload-icon { font-size: 32px; margin-bottom: 12px; opacity: 0.7; }
  .upload-text { font-size: 15px; color: var(--text); margin-bottom: 6px; }
  .upload-hint { font-size: 13px; }

  #fileInput { display: none; }

  .file-info {
    display: none;
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 12px 16px;
    margin-top: 12px;
  }

  .file-info.active {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .file-name {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 500;
    font-size: 14px;
    min-width: 0;
  }

  .file-name span:last-child {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .file-size {
    color: var(--text-dim);
    font-size: 13px;
    flex: none;
    font-variant-numeric: tabular-nums;
  }

  .format-section { margin-top: 24px; }

  .section-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-dim);
    margin-bottom: 12px;
  }

  .format-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
  }

  @media (max-width: 520px) {
    .format-grid { grid-template-columns: repeat(2, 1fr); }
  }

  .format-option {
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 14px 8px;
    cursor: pointer;
    text-align: center;
    transition: border-color 0.15s ease, background 0.15s ease;
  }

  .format-option:hover { border-color: var(--text-dim); }

  .format-option.selected {
    background: var(--accent);
    border-color: var(--accent);
  }

  .format-option.selected .format-label { color: var(--accent-ink); }
  .format-icon { font-size: 20px; margin-bottom: 6px; }
  .format-label { font-weight: 600; font-size: 13px; }

  .convert-btn {
    width: 100%;
    margin-top: 24px;
    padding: 12px 16px;
    border-radius: 7px;
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    border: 1px solid var(--accent);
    background: var(--accent);
    color: var(--accent-ink);
    transition: opacity 0.15s ease;
  }

  .convert-btn:hover { opacity: 0.92; }
  .convert-btn:disabled { opacity: 0.35; cursor: not-allowed; }

  .result-section { display: none; margin-top: 20px; }
  .result-section.active { display: block; }

  .result-card {
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 24px;
    text-align: center;
  }

  .success-icon { font-size: 28px; margin-bottom: 10px; }
  .success-text { font-size: 16px; font-weight: 600; margin-bottom: 4px; }
  .success-detail { color: var(--text-dim); font-size: 13.5px; margin-bottom: 16px; }

  .download-link {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 10px 18px;
    background: var(--accent);
    color: var(--accent-ink);
    text-decoration: none;
    border-radius: 7px;
    font-weight: 600;
    font-size: 13.5px;
    transition: opacity 0.15s ease;
  }

  .download-link:hover { opacity: 0.92; }
</style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🔄 Chuyển định dạng ảnh online miễn phí</h1>
            <p class="subtitle">Chuyển đổi định dạng ảnh dễ dàng & nhanh chóng</p>
        </header>

        <div class="main-card">
            <div class="upload-section">
                <div class="upload-area" id="uploadArea">
                    <div class="upload-icon">🖼️</div>
                    <div class="upload-text">Chọn ảnh cần chuyển đổi</div>
                    <div class="upload-hint">Hỗ trợ JPG, PNG, WEBP, BMP, GIF</div>
                    <input type="file" id="fileInput" accept="image/*">
                </div>
                <div class="file-info" id="fileInfo">
                    <div class="file-name">
                        <span>📄</span>
                        <span id="fileName">-</span>
                    </div>
                    <div class="file-size" id="fileSize">-</div>
                </div>
            </div>

            <div class="format-section">
                <div class="section-title">Chọn định dạng đích</div>
                <div class="format-grid">
                    <div class="format-option selected" data-format="image/jpeg" data-ext="jpg">
                        <div class="format-icon">📷</div>
                        <div class="format-label">JPG</div>
                    </div>
                    <div class="format-option" data-format="image/png" data-ext="png">
                        <div class="format-icon">🖼️</div>
                        <div class="format-label">PNG</div>
                    </div>
                    <div class="format-option" data-format="image/webp" data-ext="webp">
                        <div class="format-icon">🌐</div>
                        <div class="format-label">WEBP</div>
                    </div>
                    <div class="format-option" data-format="image/bmp" data-ext="bmp">
                        <div class="format-icon">🎨</div>
                        <div class="format-label">BMP</div>
                    </div>
                    <div class="format-option" data-format="image/gif" data-ext="gif">
                        <div class="format-icon">✨</div>
                        <div class="format-label">GIF</div>
                    </div>
                    <div class="format-option" data-format="image/jpeg" data-ext="jpeg">
                        <div class="format-icon">📸</div>
                        <div class="format-label">JPEG</div>
                    </div>
                </div>
            </div>

            <button class="convert-btn" id="convertBtn" disabled>
                <span>🔄 Chuyển đổi ngay</span>
            </button>

            <div class="result-section" id="resultSection">
                <div class="result-card">
                    <div class="success-icon">✅</div>
                    <div class="success-text">Chuyển đổi thành công!</div>
                    <div class="success-detail" id="resultDetail">-</div>
                    <a href="#" id="downloadLink" class="download-link">
                        💾 Tải xuống ảnh
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script>
        const fileInput = document.getElementById('fileInput');
        const uploadArea = document.getElementById('uploadArea');
        const fileInfo = document.getElementById('fileInfo');
        const fileName = document.getElementById('fileName');
        const fileSize = document.getElementById('fileSize');
        const formatOptions = document.querySelectorAll('.format-option');
        const convertBtn = document.getElementById('convertBtn');
        const resultSection = document.getElementById('resultSection');
        const resultDetail = document.getElementById('resultDetail');
        const downloadLink = document.getElementById('downloadLink');

        let selectedFile = null;
        let selectedFormat = 'image/jpeg';
        let selectedExt = 'jpg';

        // Upload area click
        uploadArea.addEventListener('click', () => fileInput.click());

        // Drag and drop
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.style.borderColor = 'var(--accent)';
            uploadArea.style.background = 'rgba(232, 163, 61, 0.12)';
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.style.borderColor = '';
            uploadArea.style.background = '';
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.style.borderColor = '';
            uploadArea.style.background = '';
            const file = e.dataTransfer.files[0];
            if (file && file.type.startsWith('image/')) {
                loadFile(file);
            }
        });

        // File input change
        fileInput.addEventListener('change', (e) => {
            if (e.target.files && e.target.files[0]) {
                loadFile(e.target.files[0]);
            }
        });

        function loadFile(file) {
            selectedFile = file;
            fileName.textContent = file.name;
            
            const sizeKB = (file.size / 1024).toFixed(2);
            const sizeMB = (file.size / (1024 * 1024)).toFixed(2);
            fileSize.textContent = file.size > 1024 * 1024 ? `${sizeMB} MB` : `${sizeKB} KB`;
            
            fileInfo.classList.add('active');
            convertBtn.disabled = false;
            resultSection.classList.remove('active');
        }

        // Format selection
        formatOptions.forEach(option => {
            option.addEventListener('click', () => {
                formatOptions.forEach(opt => opt.classList.remove('selected'));
                option.classList.add('selected');
                selectedFormat = option.dataset.format;
                selectedExt = option.dataset.ext;
            });
        });

        // Convert button
        convertBtn.addEventListener('click', () => {
            if (!selectedFile) {
                alert('Vui lòng chọn một ảnh trước!');
                return;
            }

            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    canvas.width = img.width;
                    canvas.height = img.height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0);

                    let quality = 0.92;
                    if (selectedFormat === 'image/png' || selectedFormat === 'image/gif' || selectedFormat === 'image/bmp') {
                        quality = undefined;
                    }

                    canvas.toBlob((blob) => {
                        const url = URL.createObjectURL(blob);
                        
                        // Get original name and replace extension
                        let originalName = selectedFile.name;
                        const lastDot = originalName.lastIndexOf('.');
                        const nameWithoutExt = lastDot > -1 ? originalName.substring(0, lastDot) : originalName;
                        const newFileName = nameWithoutExt + '.' + selectedExt;

                        // Update result
                        resultDetail.textContent = `Đã chuyển sang định dạng ${selectedExt.toUpperCase()}`;
                        downloadLink.href = url;
                        downloadLink.download = newFileName;
                        resultSection.classList.add('active');

                        // Smooth scroll to result
                        setTimeout(() => {
                            resultSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
                        }, 100);
                    }, selectedFormat, quality);
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(selectedFile);
        });
    </script>
</body>
</html>
