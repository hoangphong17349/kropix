<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cắt ảnh online miễn phí, không cần cài phần mềm | Kropix</title>
    <meta name="description" content="Cắt ảnh online miễn phí: kéo khung chọn vùng cần giữ rồi tải về ngay. Dùng trên trình duyệt, không cần cài phần mềm hay đăng ký.">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
  :root {
    --bg: #16171a;
    --panel: #1e2024;
    --panel-2: #26282f;
    --line: #2c2e33;
    --text: #e7e6e2;
    --text-dim: #8b8d92;
    --accent: #e8a33d;
    --accent-ink: #201603;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 40px 24px 80px;
  }

  .container { max-width: 1080px; margin: 0 auto; }

  header {
    margin-bottom: 32px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 16px;
    flex-wrap: wrap;
  }

  .btn.btn-header { width: auto; flex-shrink: 0; padding: 9px 16px; }

  .divider {
    height: 1px;
    background: var(--line);
    margin: 6px 0;
  }

  h1 {
    font-size: 22px;
    font-weight: 600;
    letter-spacing: -0.01em;
    margin-bottom: 6px;
  }

  .subtitle { color: var(--text-dim); font-size: 14px; }

  .main-grid {
    display: grid;
    grid-template-columns: 1.6fr 1fr;
    gap: 24px;
    align-items: start;
  }

  @media (max-width: 760px) {
    .main-grid { grid-template-columns: 1fr; }
  }

  .image-section,
  .controls {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
  }

  .image-section {
    padding: 36px;
    height: min(600px, 75vh);
    min-height: 320px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }

  .controls {
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    align-self: start;
  }

  .upload-area {
    width: 100%;
    border: 1px dashed var(--line);
    border-radius: 10px;
    padding: 48px 24px;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease;
    color: var(--text-dim);
  }

  .upload-area:hover { border-color: var(--accent); color: var(--text); }
  .upload-area.has-image { display: none; }

  .upload-icon { font-size: 34px; margin-bottom: 12px; opacity: 0.7; }
  .upload-text { font-size: 15px; color: var(--text); margin-bottom: 6px; }
  .upload-hint { font-size: 13px; }

  #fileInput { display: none; }

  /* Khung chỉnh sửa có kích thước cố định, ảnh tự co giãn vừa khung */
  .image-wrapper { display: none; width: 100%; height: 100%; }
  .image-wrapper.active { display: block; }

  #image {
    max-width: 100%;
    display: block;
  }

  .control-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-dim);
    margin-bottom: 2px;
  }

  .btn {
    width: 100%;
    padding: 11px 14px;
    border-radius: 7px;
    font-family: inherit;
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--text);
    transition: border-color 0.15s ease, opacity 0.15s ease;
  }

  .btn:hover { border-color: var(--text-dim); }
  .btn:disabled { opacity: 0.35; cursor: not-allowed; }

  .btn-primary {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-ink);
  }

  .btn-primary:hover { border-color: var(--accent); opacity: 0.92; }
  .btn-secondary { color: var(--text-dim); }

  .stats {
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 4px 14px;
    text-align: left;
  }

  .stat-item {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    padding: 10px 0;
    border-bottom: 1px solid var(--line);
    font-size: 13px;
  }

  .stat-item:last-child { border-bottom: none; }
  .stat-label { color: var(--text-dim); }
  .stat-value { font-weight: 600; font-variant-numeric: tabular-nums; }

  /* Custom Cropper.js styling */
  .cropper-view-box,
  .cropper-face { background: rgba(232, 163, 61, 0.08); }

  .cropper-line,
  .cropper-point { background-color: var(--accent); }

  .cropper-point { width: 10px; height: 10px; opacity: 0.9; }
  .cropper-point.point-se { width: 14px; height: 14px; }

  /* Cho phép tay cầm nhô ra ngoài mép ảnh mà không bị cắt */
  .image-section, .image-wrapper, .cropper-container { overflow: visible; }
  .image-section { overflow: hidden; }

  /* Ẩn nền ô vuông caro để không thấy mép của vùng chứa */
  .cropper-bg { background: none; }

  /* ===== Giao diện điện thoại: gọn trong đúng 1 màn hình, không cần cuộn ===== */
  @media (max-width: 760px) {
    html, body { height: 100%; }
    body {
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      padding: 12px;
    }
    .container {
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    header {
      margin-bottom: 10px;
      flex-wrap: nowrap;
      align-items: center;
    }
    header > div { min-width: 0; }
    h1 { font-size: 15px; margin-bottom: 0; }
    .subtitle { display: none; }
    .btn.btn-header { padding: 8px 10px; font-size: 12px; white-space: nowrap; }

    .main-grid {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* Khung ảnh chiếm toàn bộ phần còn lại của màn hình */
    .image-section {
      flex: 1;
      min-height: 0;
      height: auto;
      padding: 0;
    }
    .image-wrapper {
      position: absolute;
      top: 12px; right: 12px; bottom: 12px; left: 12px;
      width: auto;
      height: auto;
    }
    .upload-area { padding: 32px 16px; margin: 12px; width: auto; }

    /* Thanh thao tác gọn ở dưới: 3 nút một hàng, thông số một hàng, nút tải một hàng */
    .controls {
      flex-shrink: 0;
      padding: 10px;
      gap: 8px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
    }
    .controls .control-group { display: none; }
    .controls .btn {
      padding: 8px 4px;
      font-size: 12px;
      min-height: 42px;
      line-height: 1.25;
    }
    .controls .stats {
      grid-column: 1 / -1;
      display: grid !important;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      padding: 4px 10px;
    }
    .controls .stats[style*="display: none"] { display: none !important; }
    .stat-item {
      flex-direction: column;
      gap: 2px;
      padding: 4px 0;
      border-bottom: none;
      font-size: 10.5px;
    }
    .stat-value { font-size: 12px; }
    .divider { display: none; }
    .controls #downloadBtn {
      grid-column: 1 / -1;
      min-height: 46px;
      font-size: 14px;
    }
  }
</style>
</head>
<body>
    <div class="container">
        <header>
            <div>
                <h1>✂️ Cắt ảnh online miễn phí</h1>
                <p class="subtitle">Công cụ chỉnh sửa ảnh chuyên nghiệp</p>
            </div>
            <button class="btn btn-secondary btn-header" id="newBtn" disabled>📁 Mở ảnh khác</button>
        </header>

        <div class="main-grid">
            <div class="image-section">
                <div class="upload-area" id="uploadArea">
                    <div class="upload-icon">📸</div>
                    <div class="upload-text">Kéo thả ảnh vào đây</div>
                    <div class="upload-hint">hoặc nhấn để chọn file</div>
                    <input type="file" id="fileInput" accept="image/*">
                </div>

                <div class="image-wrapper" id="imageWrapper">
                    <img id="image" src="">
                </div>
            </div>

            <div class="controls">
                <div class="control-group">
                    <div class="control-title">Thao tác</div>
                </div>

                <button class="btn" id="cropBtn" disabled>✂️ Cắt</button>
                <button class="btn" id="undoBtn" disabled>↩️ Hoàn tác</button>
                <button class="btn btn-secondary" id="resetBtn" disabled>🔄 Đặt lại từ đầu</button>

                <div class="stats" id="imageStats" style="display: none;">
                    <div class="stat-item">
                        <span class="stat-label">Kích thước ảnh</span>
                        <span class="stat-value" id="originalSize">-</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Vùng chọn</span>
                        <span class="stat-value" id="cropSize">-</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Trạng thái</span>
                        <span class="stat-value" id="status">Chờ tải ảnh</span>
                    </div>
                </div>

                <div class="divider"></div>
                <button class="btn btn-primary" id="downloadBtn" disabled>💾 Tải ảnh xuống</button>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.js"></script>
    <script>
        const fileInput = document.getElementById('fileInput');
        const uploadArea = document.getElementById('uploadArea');
        const imageWrapper = document.getElementById('imageWrapper');
        const image = document.getElementById('image');
        const downloadBtn = document.getElementById('downloadBtn');
        const cropBtn = document.getElementById('cropBtn');
        const resetBtn = document.getElementById('resetBtn');
        const undoBtn = document.getElementById('undoBtn');
        const newBtn = document.getElementById('newBtn');
        const imageStats = document.getElementById('imageStats');
        const originalSize = document.getElementById('originalSize');
        const cropSize = document.getElementById('cropSize');
        const status = document.getElementById('status');

        let cropper = null;
        let originalImageData = null;
        let currentImageData = null;
        let history = []; // các phiên bản ảnh trước đó, dùng cho Hoàn tác

        const CANVAS_OPTIONS = {
            maxWidth: 4096,
            maxHeight: 4096,
            fillColor: '#fff',
            imageSmoothingEnabled: true,
            imageSmoothingQuality: 'high'
        };

        uploadArea.addEventListener('click', () => fileInput.click());
        newBtn.addEventListener('click', () => { fileInput.value = ''; fileInput.click(); });

        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.style.borderColor = 'var(--accent)';
            uploadArea.style.background = 'rgba(232, 163, 61, 0.12)';
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.style.borderColor = '';
            uploadArea.style.background = '';
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.style.borderColor = '';
            uploadArea.style.background = '';
            const file = e.dataTransfer.files[0];
            if (file && file.type.startsWith('image/')) loadImage(file);
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files && e.target.files[0]) loadImage(e.target.files[0]);
        });

        function loadImage(file) {
            const reader = new FileReader();
            reader.onload = (event) => {
                originalImageData = event.target.result;
                history = [];
                initCropper(originalImageData, 'Sẵn sàng chỉnh sửa');
            };
            reader.readAsDataURL(file);
        }

        // Luôn dùng chung một khung chỉnh sửa duy nhất
        function initCropper(src, statusText) {
            if (cropper) {
                cropper.destroy();
                cropper = null;
            }

            currentImageData = src;
            image.src = src;
            uploadArea.classList.add('has-image');
            imageWrapper.classList.add('active');

            cropper = new Cropper(image, {
                aspectRatio: NaN,
                viewMode: 1,
                dragMode: 'move',
                autoCropArea: 1,
                restore: false,
                guides: true,
                center: true,
                highlight: false,
                cropBoxMovable: true,
                cropBoxResizable: true,
                toggleDragModeOnDblclick: false,
                responsive: true,
                ready: function () {
                    fitImageWithMargin();
                    const imgData = cropper.getImageData();
                    originalSize.textContent = `${Math.round(imgData.naturalWidth)} × ${Math.round(imgData.naturalHeight)} px`;
                    status.textContent = statusText;
                    imageStats.style.display = 'block';
                    updateCropSize();
                },
                crop: updateCropSize
            });

            downloadBtn.disabled = false;
            cropBtn.disabled = false;
            resetBtn.disabled = false;
            newBtn.disabled = false;
            undoBtn.disabled = history.length === 0;
        }

        // Thu nhỏ ảnh vào giữa khung, chừa khoảng trống ở cả 4 mép
        function fitImageWithMargin() {
            const MARGIN = 32;
            const container = cropper.getContainerData();
            const img = cropper.getImageData();
            const scale = Math.min(
                (container.width - MARGIN * 2) / img.naturalWidth,
                (container.height - MARGIN * 2) / img.naturalHeight
            );
            const w = img.naturalWidth * scale;
            const h = img.naturalHeight * scale;
            const left = (container.width - w) / 2;
            const top = (container.height - h) / 2;
            cropper.setCanvasData({ left, top, width: w, height: h });
            cropper.setCropBoxData({ left, top, width: w, height: h });
        }

        function updateCropSize() {
            if (!cropper) return;
            const d = cropper.getData(true);
            cropSize.textContent = `${d.width} × ${d.height} px`;
        }

        // Áp dụng cắt ngay trong khung, không hiện thêm phần kết quả
        cropBtn.addEventListener('click', () => {
            if (!cropper) return;
            const canvas = cropper.getCroppedCanvas(CANVAS_OPTIONS);
            history.push(currentImageData);
            initCropper(canvas.toDataURL('image/png'), 'Đã cắt, có thể chỉnh tiếp');
        });

        undoBtn.addEventListener('click', () => {
            if (history.length === 0) return;
            initCropper(history.pop(), 'Đã hoàn tác');
        });

        // Tải xuống đúng vùng đang chọn trong khung
        downloadBtn.addEventListener('click', () => {
            if (!cropper) return;
            const canvas = cropper.getCroppedCanvas(CANVAS_OPTIONS);
            canvas.toBlob((blob) => {
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'anh-da-cat.png';
                document.body.appendChild(a);
                a.click();
                a.remove();
                setTimeout(() => URL.revokeObjectURL(url), 1000);
                status.textContent = 'Đã tải xuống';
            }, 'image/png');
        });

        resetBtn.addEventListener('click', () => {
            if (!originalImageData || currentImageData === originalImageData) return;
            history.push(currentImageData); // đặt lại cũng có thể hoàn tác
            initCropper(originalImageData, 'Đã đặt lại ảnh gốc');
        });
    </script>
</body>
</html>
