<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cắt ảnh online miễn phí, không cần cài phần mềm | Kropix</title>
    <meta name="description" content="Cắt ảnh online miễn phí: kéo khung chọn vùng cần giữ rồi tải về ngay. Dùng trên trình duyệt, không cần cài phần mềm hay đăng ký.">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
  :root {
    --bg: #16171a;
    --panel: #1e2024;
    --panel-2: #26282f;
    --line: #2c2e33;
    --text: #e7e6e2;
    --text-dim: #8b8d92;
    --accent: #e8a33d;
    --accent-ink: #201603;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 40px 24px 80px;
  }

  .container { max-width: 1080px; margin: 0 auto; }

  header { margin-bottom: 32px; }

  h1 {
    font-size: 22px;
    font-weight: 600;
    letter-spacing: -0.01em;
    margin-bottom: 6px;
  }

  .subtitle { color: var(--text-dim); font-size: 14px; }

  .main-grid {
    display: grid;
    grid-template-columns: 1.6fr 1fr;
    gap: 24px;
    align-items: start;
  }

  @media (max-width: 760px) {
    .main-grid { grid-template-columns: 1fr; }
  }

  .image-section,
  .controls {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
  }

  .image-section {
    padding: 14px;
    min-height: 420px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }

  .controls {
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 20px;
    align-self: start;
  }

  .upload-area {
    width: 100%;
    border: 1px dashed var(--line);
    border-radius: 10px;
    padding: 48px 24px;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease;
    color: var(--text-dim);
  }

  .upload-area:hover { border-color: var(--accent); color: var(--text); }
  .upload-area.has-image { display: none; }

  .upload-icon { font-size: 34px; margin-bottom: 12px; opacity: 0.7; }
  .upload-text { font-size: 15px; color: var(--text); margin-bottom: 6px; }
  .upload-hint { font-size: 13px; }

  #fileInput { display: none; }

  .image-wrapper { display: none; width: 100%; }
  .image-wrapper.active { display: block; }

  #image {
    max-width: 100%;
    max-height: 560px;
    display: block;
    border-radius: 6px;
    margin: 0 auto;
  }

  .control-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-dim);
    margin-bottom: 2px;
  }

  .btn {
    width: 100%;
    padding: 11px 14px;
    border-radius: 7px;
    font-family: inherit;
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--text);
    transition: border-color 0.15s ease, opacity 0.15s ease;
  }

  .btn:hover { border-color: var(--text-dim); }
  .btn:disabled { opacity: 0.35; cursor: not-allowed; }

  .btn-primary {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-ink);
  }

  .btn-primary:hover { border-color: var(--accent); opacity: 0.92; }
  .btn-secondary { color: var(--text-dim); }

  .result-section { display: none; margin-top: 24px; }
  .result-section.active { display: block; }

  .result-title {
    font-size: 16px;
    font-weight: 600;
    margin-bottom: 14px;
  }

  .result-content {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 20px;
    text-align: center;
  }

  .result-content img {
    max-width: 100%;
    max-height: 560px;
    border-radius: 6px;
    margin-bottom: 16px;
  }

  .download-link {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 10px 18px;
    background: var(--accent);
    color: var(--accent-ink);
    text-decoration: none;
    border-radius: 7px;
    font-weight: 600;
    font-size: 13.5px;
    transition: opacity 0.15s ease;
  }

  .download-link:hover { opacity: 0.92; }

  .stats {
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 4px 14px;
    margin-top: 12px;
    text-align: left;
  }

  .stat-item {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    padding: 10px 0;
    border-bottom: 1px solid var(--line);
    font-size: 13px;
  }

  .stat-item:last-child { border-bottom: none; }
  .stat-label { color: var(--text-dim); }
  .stat-value { font-weight: 600; font-variant-numeric: tabular-nums; }

  /* Custom Cropper.js styling */
  .cropper-view-box,
  .cropper-face { background: rgba(232, 163, 61, 0.08); }

  .cropper-line,
  .cropper-point { background-color: var(--accent); }

  .cropper-point { width: 8px; height: 8px; opacity: 0.8; }
  .cropper-point.point-se { width: 12px; height: 12px; }
</style>
</head>
<body>
    <div class="container">
        <header>
            <h1>✂️ Cắt ảnh online miễn phí</h1>
            <p class="subtitle">Công cụ chỉnh sửa ảnh chuyên nghiệp</p>
        </header>

        <div class="main-grid">
            <div class="image-section">
                <div class="upload-area" id="uploadArea">
                    <div class="upload-icon">📸</div>
                    <div class="upload-text">Kéo thả ảnh vào đây</div>
                    <div class="upload-hint">hoặc nhấn để chọn file</div>
                    <input type="file" id="fileInput" accept="image/*">
                </div>

                <div class="image-wrapper" id="imageWrapper">
                    <img id="image" src="">
                </div>
            </div>

            <div class="controls">
                <div class="control-group">
                    <div class="control-title">Thao tác</div>
                    <button class="btn btn-primary" id="cropBtn" disabled>
                        <span>✂️ Cắt ảnh</span>
                    </button>
                </div>

                <div class="control-group">
                    <button class="btn btn-secondary" id="resetBtn" disabled>
                        <span>🔄 Đặt lại</span>
                    </button>
                </div>

                <div class="control-group">
                    <div class="stats" id="imageStats" style="display: none;">
                        <div class="stat-item">
                            <span class="stat-label">Kích thước gốc</span>
                            <span class="stat-value" id="originalSize">-</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-label">Trạng thái</span>
                            <span class="stat-value" id="status">Chờ tải ảnh</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="result-section" id="resultSection">
            <h2 class="result-title">✨ Kết quả</h2>
            <div class="result-content" id="result"></div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.js"></script>
    <script>
        const fileInput = document.getElementById('fileInput');
        const uploadArea = document.getElementById('uploadArea');
        const imageWrapper = document.getElementById('imageWrapper');
        const image = document.getElementById('image');
        const cropBtn = document.getElementById('cropBtn');
        const resetBtn = document.getElementById('resetBtn');
        const resultSection = document.getElementById('resultSection');
        const result = document.getElementById('result');
        const imageStats = document.getElementById('imageStats');
        const originalSize = document.getElementById('originalSize');
        const status = document.getElementById('status');

        let cropper;
        let originalImageData;

        // Upload area click
        uploadArea.addEventListener('click', () => fileInput.click());

        // Drag and drop
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.style.borderColor = 'var(--accent)';
            uploadArea.style.background = 'rgba(232, 163, 61, 0.12)';
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.style.borderColor = '';
            uploadArea.style.background = '';
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.style.borderColor = '';
            uploadArea.style.background = '';
            const file = e.dataTransfer.files[0];
            if (file && file.type.startsWith('image/')) {
                loadImage(file);
            }
        });

        // File input change
        fileInput.addEventListener('change', (e) => {
            if (e.target.files && e.target.files[0]) {
                loadImage(e.target.files[0]);
            }
        });

        function loadImage(file) {
            const reader = new FileReader();
            reader.onload = (event) => {
                originalImageData = event.target.result;
                image.src = originalImageData;
                
                uploadArea.classList.add('has-image');
                imageWrapper.classList.add('active');
                
                if (cropper) {
                    cropper.destroy();
                }
                
                cropper = new Cropper(image, {
                    aspectRatio: NaN,
                    viewMode: 1,
                    dragMode: 'move',
                    autoCropArea: 0.8,
                    restore: false,
                    guides: true,
                    center: true,
                    highlight: false,
                    cropBoxMovable: true,
                    cropBoxResizable: true,
                    toggleDragModeOnDblclick: false,
                    responsive: true,
                    ready: function() {
                        const imgData = cropper.getImageData();
                        originalSize.textContent = `${Math.round(imgData.naturalWidth)} × ${Math.round(imgData.naturalHeight)} px`;
                        status.textContent = 'Sẵn sàng cắt';
                        imageStats.style.display = 'block';
                    }
                });
                
                cropBtn.disabled = false;
                resetBtn.disabled = false;
                resultSection.classList.remove('active');
            };
            reader.readAsDataURL(file);
        }

        cropBtn.addEventListener('click', () => {
            if (cropper) {
                const croppedCanvas = cropper.getCroppedCanvas({
                    maxWidth: 4096,
                    maxHeight: 4096,
                    fillColor: '#fff',
                    imageSmoothingEnabled: true,
                    imageSmoothingQuality: 'high',
                });
                
                const croppedImage = croppedCanvas.toDataURL('image/png');
                
                result.innerHTML = `
                    <img src="${croppedImage}" alt="Ảnh đã cắt">
                    <div class="stats">
                        <div class="stat-item">
                            <span class="stat-label">Kích thước mới</span>
                            <span class="stat-value">${croppedCanvas.width} × ${croppedCanvas.height} px</span>
                        </div>
                    </div>
                    <br>
                    <a href="${croppedImage}" download="anh-da-cat.png" class="download-link">
                        💾 Tải xuống ảnh
                    </a>
                `;
                
                resultSection.classList.add('active');
                
                // Smooth scroll to result
                setTimeout(() => {
                    resultSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
                }, 100);
                
                status.textContent = 'Đã cắt xong';
            }
        });

        resetBtn.addEventListener('click', () => {
            if (cropper) {
                cropper.reset();
                resultSection.classList.remove('active');
                status.textContent = 'Đã đặt lại';
                setTimeout(() => {
                    status.textContent = 'Sẵn sàng cắt';
                }, 2000);
            }
        });
    </script>
</body>
</html>
